
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRT — Баланс</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101116;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 420px;
            margin: 45px auto;
        }

        h2 {
            text-align: center;
            font-size: 23px;
            margin-bottom: 30px;
        }

        .card {
            background: #1b1d26;
            border: 1px solid #30323e;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
        }

        .title {
            color: #a4a6b5;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .value {
            font-size: 27px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #status {
            text-align: center;
            color: #a4a6b5;
            font-size: 13px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>VIRT — Мой баланс</h2>

        <div class="card">
            <div class="title">Игровой баланс</div>
            <div class="value" id="balance">Загрузка...</div>
        </div>

        <div class="card">
            <div class="title">Баланс банка</div>
            <div class="value" id="bank">Загрузка...</div>
        </div>

        <div id="status">Подключение к серверу...</div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        // HTTPS-адрес твоего API
        const API_URL = "https://merchant-training-norfolk-kinds.trycloudflare.com/balance";

        async function loadBalance() {
            const status = document.getElementById("status");

            try {
                if (!tg.initData) {
                    throw new Error("Открой приложение через Telegram");
                }

                const response = await fetch(API_URL, {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        initData: tg.initData
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Ошибка API");
                }

                document.getElementById("balance").textContent =
                    Number(data.balance).toLocaleString("ru-RU") + " вирт";

                document.getElementById("bank").textContent =
                    Number(data.bank_balance).toLocaleString("ru-RU") + " вирт";

                status.textContent = "Данные успешно загружены";

            } catch (error) {
                document.getElementById("balance").textContent = "—";
                document.getElementById("bank").textContent = "—";

                status.textContent = error.message;
            }
        }

        loadBalance();
    </script>

</body>
</html>
