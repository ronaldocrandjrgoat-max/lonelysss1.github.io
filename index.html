<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #0f0;
        }
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
        }
        .btn {
            background: #333;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .btn:active {
            background: #555;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="score">Счет: <span id="score">0</span></div>
    <canvas id="game" width="300" height="300"></canvas>

    <div class="controls">
        <button class="btn btn-up" onclick="changeDirection('up')">▲</button>
        <button class="btn btn-left" onclick="changeDirection('left')">◀</button>
        <button class="btn btn-down" onclick="changeDirection('down')">▼</button>
        <button class="btn btn-right" onclick="changeDirection('right')">▶</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const box = 15; // размер клетки
        let score = 0;
        let snake = [];
        let food = {};
        let direction = "";
        let game;

        // Инициализация
        snake[0] = { x: 10 * box, y: 10 * box };
        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };

        // Управление с клавиатуры (для ПК)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') changeDirection('up');
            if (e.key === 'ArrowDown') changeDirection('down');
            if (e.key === 'ArrowLeft') changeDirection('left');
            if (e.key === 'ArrowRight') changeDirection('right');
        });

        function changeDirection(newDir) {
            if (newDir === 'up' && direction !== 'down') direction = 'up';
            if (newDir === 'down' && direction !== 'up') direction = 'down';
            if (newDir === 'left' && direction !== 'right') direction = 'left';
            if (newDir === 'right' && direction !== 'left') direction = 'right';
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем змейку
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#0f0" : "#0a0"; // голова светлее
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Рисуем еду
            ctx.fillStyle = "#f00";
            ctx.fillRect(food.x, food.y, box, box);

            // Координаты головы
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Движение
            if (direction === "left") snakeX -= box;
            if (direction === "up") snakeY -= box;
            if (direction === "right") snakeX += box;
            if (direction === "down") snakeY += box;

            // Поедание еды
            if (snakeX === food.x && snakeY === food.y) {
                score++;
                scoreElement.innerText = score;
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            } else {
                // Удаляем хвост, если не съели еду
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // Проверка на проигрыш (врезался в стену или в себя)
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                setTimeout(() => {
                    alert("Игра окончена! Счет: " + score);
                    location.reload(); // перезапуск
                }, 10);
                return;
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 1; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        // Запуск игры
        game = setInterval(draw, 120);
    </script>
</body>
</html>
