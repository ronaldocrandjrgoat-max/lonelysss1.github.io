

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#101114">
    <title>VIRT — Личный кабинет</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #101114;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 24px 17px;
        }

        .container {
            max-width: 430px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #777b87;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .profile {
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 22px;
            padding: 27px 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        .avatar {
            width: 94px;
            height: 94px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
            border: 3px solid #383c46;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .profile-id {
            color: #898d99;
            font-size: 13px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 19px;
            padding: 20px 15px;
            min-width: 0;
        }

        .card-title {
            color: #9296a2;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .card-value {
            font-size: clamp(17px, 5vw, 23px);
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .balance {
            color: #f3c75b;
        }

        .bank {
            color: #78a9ff;
        }

        .login {
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 22px;
            padding: 25px 19px;
            text-align: center;
        }

        .login h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .login-description {
            color: #9296a2;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .code-input {
            width: 100%;
            height: 54px;
            background: #101114;
            border: 1px solid #343741;
            border-radius: 13px;
            outline: none;
            color: #fff;
            text-align: center;
            font-size: 23px;
            letter-spacing: 8px;
            margin-bottom: 13px;
        }

        .code-input:focus {
            border-color: #8188ff;
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: #fff;
            color: #111;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: .5;
        }

        .error {
            color: #ff7777;
            font-size: 13px;
            margin-top: 14px;
            min-height: 17px;
        }

        .footer {
            color: #626671;
            text-align: center;
            font-size: 11px;
            margin-top: 30px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">𝐕𝐈𝐑𝐓</div>
        <div class="subtitle">PERSONAL ACCOUNT</div>
    </header>

    <!-- АВТОРИЗАЦИЯ -->

    <section id="login" class="login">

        <h2>Добро пожаловать!</h2>

        <p class="login-description">
            Для входа в личный кабинет отправь команду
            <b>/web</b> боту VIRT и введи полученный код.
        </p>

        <input
            id="code"
            class="code-input"
            type="tel"
            inputmode="numeric"
            maxlength="6"
            placeholder="••••••"
            autocomplete="one-time-code"
        >

        <button
            id="loginButton"
            class="login-button"
            onclick="login()"
        >
            Войти в аккаунт
        </button>

        <div id="error" class="error"></div>

    </section>

    <!-- ЛИЧНЫЙ КАБИНЕТ -->

    <section id="account" class="hidden">

        <div class="profile">

            <img
                id="avatar"
                class="avatar"
                src=""
                alt="Аватар"
            >

            <div id="name" class="profile-name">
                Игрок VIRT
            </div>

            <div class="profile-id">
                ID: <span id="userId">—</span>
            </div>

        </div>

        <div class="cards">

            <div class="card">
                <div class="card-title">💰 Баланс</div>
                <div id="balance" class="card-value balance">0</div>
            </div>

            <div class="card">
                <div class="card-title">🏦 Банк</div>
                <div id="bankBalance" class="card-value bank">0</div>
            </div>

        </div>

    </section>

    <footer class="footer">
        VIRT © 2026
    </footer>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // СЮДА ПОЗЖЕ ВСТАВИМ АДРЕС API
    const API_URL = "https://governor-fruit-finite-busy.trycloudflare.com";

    const telegramUser = tg.initDataUnsafe?.user;

    function formatNumber(value) {
        return Number(value || 0).toLocaleString("ru-RU");
    }

    // Аватар Telegram
    if (telegramUser?.photo_url) {
        document.getElementById("avatar").src =
            telegramUser.photo_url;
    } else {
        document.getElementById("avatar").src =
            "https://ui-avatars.com/api/?name=VIRT&background=30333b&color=fff";
    }

    // Имя Telegram
    if (telegramUser) {
        document.getElementById("name").textContent =
            telegramUser.first_name || "Игрок VIRT";
    }

    function showError(text) {
        document.getElementById("error").textContent = text;
    }

    // Авторизация
    async function login() {
        const code = document.getElementById("code").value.trim();
        const button = document.getElementById("loginButton");

        if (!/^\d{6}$/.test(code)) {
            showError("Введите шестизначный код.");
            return;
        }

        button.disabled = true;
        button.textContent = "Проверка...";
        showError("");

        try {
            const response = await fetch(API_URL + "/auth", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ code })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Ошибка входа");
            }

            localStorage.setItem("virt_session", data.token);

            await loadProfile();

        } catch (error) {
            showError(error.message || "Ошибка соединения.");
        }

        button.disabled = false;
        button.textContent = "Войти в аккаунт";
    }

    // Загрузка профиля
    async function loadProfile() {
        const token = localStorage.getItem("virt_session");

        if (!token) return;

        try {
            const response = await fetch(API_URL + "/me", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            if (!response.ok) {
                localStorage.removeItem("virt_session");

                document.getElementById("account")
                    .classList.add("hidden");

                document.getElementById("login")
                    .classList.remove("hidden");

                showError("Сессия истекла. Используй /web заново.");
                return;
            }

            document.getElementById("userId").textContent =
                data.user_id;

            document.getElementById("balance").textContent =
                formatNumber(data.balance);

            document.getElementById("bankBalance").textContent =
                formatNumber(data.bank_balance);

            document.getElementById("login")
                .classList.add("hidden");

            document.getElementById("account")
                .classList.remove("hidden");

        } catch (error) {
            showError("Не удалось подключиться к серверу.");
        }
    }

    loadProfile();
</script>

</body>
</html>
