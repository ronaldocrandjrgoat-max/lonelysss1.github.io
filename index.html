<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu {
            width: 100%;
            max-width: 400px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .profile {
            width: 100%;
            max-width: 400px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ccc;
            margin: 0 auto 15px auto;
            object-fit: cover;
        }
        .name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .username { color: #666; margin-bottom: 10px; }
        .id { font-size: 12px; color: #999; margin-bottom: 20px; }
        
        .data-container {
            width: 100%;
            max-width: 400px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            display: none;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #666; font-weight: bold; }
        .data-value { color: #000; text-align: right; word-break: break-all; }
        
        .error-box {
            width: 100%;
            max-width: 400px;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
            color: #c62828;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="menu">Главное меню</div>

    <div class="profile">
        <img id="user-photo" class="avatar" src="" alt="Аватарка">
        <div id="user-name" class="name">Загрузка...</div>
        <div id="user-username" class="username"></div>
        <div id="user-id" class="id"></div>
    </div>

    <div id="data-container" class="data-container"></div>
    <div id="error-box" class="error-box"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        
        let user = tg.initDataUnsafe?.user;
        
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            
            if (user.username) {
                document.getElementById('user-username').innerText = '@' + user.username;
            }
            
            document.getElementById('user-id').innerText = 'ID: ' + user.id;
            
            if (user.photo_url) {
                document.getElementById('user-photo').src = user.photo_url;
            }

            const BOT_API_URL = "https://192.168.8.23:8080/api/balance?user_id=" + user.id;
            
            fetch(BOT_API_URL)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ошибка: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    
                    const container = document.getElementById('data-container');
                    container.innerHTML = ''; // очистка
                    
                    // Словарь для красивого вывода названий
                    const labels = {
                        "user_id": "ID",
                        "status": "Статус",
                        "balance": "Баланс",
                        "rubs": "Рубли",
                        "games": "Игры",
                        "last_bonus": "Последний бонус",
                        "limitperedachi": "Лимит передачи",
                        "viptime": "Время VIP",
                        "c": "С",
                        "channel_name": "Канал",
                        "subscribed": "Подписка",
                        "bank_balance": "Банк"
                    };

                    // Проходим по всем полям и создаем строки
                    for (const [key, value] of Object.entries(data)) {
                        if (value === null) continue; // Пропускаем пустые поля
                        
                        const row = document.createElement('div');
                        row.className = 'data-row';
                        
                        const labelSpan = document.createElement('span');
                        labelSpan.className = 'data-label';
                        labelSpan.innerText = (labels[key] || key) + ":";
                        
                        const valueSpan = document.createElement('span');
                        valueSpan.className = 'data-value';
                        valueSpan.innerText = value;
                        
                        row.appendChild(labelSpan);
                        row.appendChild(valueSpan);
                        container.appendChild(row);
                    }
                    
                    container.style.display = 'block';
                })
                .catch(err => {
                    console.error("Ошибка:", err);
                    const errBox = document.getElementById('error-box');
                    errBox.innerText = "Ошибка: " + err.message;
                    errBox.style.display = 'block';
                });
        } else {
            document.getElementById('user-name').innerText = "Пользователь не найден";
        }
    </script>
</body>
</html>
