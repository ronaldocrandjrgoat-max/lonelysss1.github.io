
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#101114">
    <title>VIRT — Личный кабинет</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #101114;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 24px 17px;
        }

        .container {
            max-width: 430px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #777b87;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .profile {
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 22px;
            padding: 27px 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        .avatar {
            width: 94px;
            height: 94px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
            border: 3px solid #383c46;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .profile-id {
            color: #898d99;
            font-size: 13px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 19px;
            padding: 20px 15px;
            min-width: 0;
        }

        .card-title {
            color: #9296a2;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .card-value {
            font-size: clamp(17px, 5vw, 23px);
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .balance {
            color: #f3c75b;
        }

        .bank {
            color: #78a9ff;
        }

        /* TOP 100 */

        .top-section {
            margin-top: 22px;
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 22px;
            padding: 19px 14px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 19px;
        }

        .top-title {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: .5px;
        }

        .top-label {
            color: #f3c75b;
            font-size: 10px;
            font-weight: 800;
            background: #302919;
            border: 1px solid #594923;
            padding: 6px 9px;
            border-radius: 8px;
        }

        .podium {
            display: grid;
            grid-template-columns: 1fr 1.12fr 1fr;
            align-items: end;
            gap: 8px;
            margin-bottom: 23px;
        }

        .podium-item {
            min-width: 0;
            text-align: center;
            background: #22252c;
            border: 1px solid #343842;
            border-radius: 15px;
            padding: 13px 5px;
        }

        .podium-item.first {
            background: linear-gradient(180deg, #49391c, #25231d);
            border-color: #9d7935;
            padding-top: 19px;
            padding-bottom: 19px;
        }

        .podium-item.second {
            border-color: #737985;
        }

        .podium-item.third {
            border-color: #946342;
        }

        .podium-crown {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .podium-avatar {
            width: 49px;
            height: 49px;
            border-radius: 50%;
            object-fit: cover;
            background: #383c46;
            border: 2px solid #50545e;
            margin-bottom: 8px;
        }

        .first .podium-avatar {
            width: 57px;
            height: 57px;
            border-color: #e8bd58;
        }

        .podium-name {
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .podium-rank {
            font-size: 11px;
            color: #c4c7ce;
            margin-bottom: 7px;
        }

        .podium-balance {
            color: #f3c75b;
            font-size: 11px;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .top-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .top-player {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            background: #22252c;
            border: 1px solid #30343d;
            border-radius: 13px;
            padding: 10px;
        }

        .player-rank {
            width: 27px;
            flex-shrink: 0;
            color: #9296a2;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
        }

        .player-avatar {
            width: 41px;
            height: 41px;
            border-radius: 50%;
            object-fit: cover;
            background: #383c46;
            flex-shrink: 0;
        }

        .player-info {
            min-width: 0;
            flex: 1;
        }

        .player-name {
            font-size: 13px;
            font-weight: 800;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .player-username {
            color: #858a96;
            font-size: 11px;
            margin-top: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .player-balance {
            color: #f3c75b;
            font-size: 12px;
            font-weight: 800;
            text-align: right;
            flex-shrink: 0;
        }

        .top-loading,
        .top-empty {
            color: #858a96;
            text-align: center;
            font-size: 13px;
            padding: 25px 5px;
        }

        .top-error {
            color: #ff7777;
        }

        .top-footer {
            color: #656a76;
            text-align: center;
            font-size: 11px;
            margin-top: 15px;
        }

        .login {
            background: #191b20;
            border: 1px solid #292c34;
            border-radius: 22px;
            padding: 25px 19px;
            text-align: center;
        }

        .login h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .login-description {
            color: #9296a2;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .code-input {
            width: 100%;
            height: 54px;
            background: #101114;
            border: 1px solid #343741;
            border-radius: 13px;
            outline: none;
            color: #fff;
            text-align: center;
            font-size: 23px;
            letter-spacing: 8px;
            margin-bottom: 13px;
        }

        .code-input:focus {
            border-color: #8188ff;
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: #fff;
            color: #111;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: .5;
        }

        .error {
            color: #ff7777;
            font-size: 13px;
            margin-top: 14px;
            min-height: 17px;
        }

        .footer {
            color: #626671;
            text-align: center;
            font-size: 11px;
            margin-top: 30px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">𝐕𝐈𝐑𝐓</div>
        <div class="subtitle">PERSONAL ACCOUNT</div>
    </header>

    <!-- АВТОРИЗАЦИЯ -->

    <section id="login" class="login">

        <h2>Добро пожаловать!</h2>

        <p class="login-description">
            Для входа в личный кабинет отправь команду
            <b>/web</b> боту VIRT и введи полученный код.
        </p>

        <input
            id="code"
            class="code-input"
            type="tel"
            inputmode="numeric"
            maxlength="6"
            placeholder="••••••"
            autocomplete="one-time-code"
        >

        <button
            id="loginButton"
            class="login-button"
            onclick="login()"
        >
            Войти в аккаунт
        </button>

        <div id="error" class="error"></div>

    </section>

    <!-- ЛИЧНЫЙ КАБИНЕТ -->

    <section id="account" class="hidden">

        <div class="profile">

            <img
                id="avatar"
                class="avatar"
                src=""
                alt="Аватар"
            >

            <div id="name" class="profile-name">
                Игрок VIRT
            </div>

            <div class="profile-id">
                ID: <span id="userId">—</span>
            </div>

        </div>

        <div class="cards">

            <div class="card">
                <div class="card-title">💰 Баланс</div>
                <div id="balance" class="card-value balance">0</div>
            </div>

            <div class="card">
                <div class="card-title">🏦 Банк</div>
                <div id="bankBalance" class="card-value bank">0</div>
            </div>

        </div>

        <!-- TOP 100 -->

        <section class="top-section">

            <div class="top-header">
                <div class="top-title">🏆 VIRT TOP 100</div>
                <div class="top-label">BALANCE</div>
            </div>

            <div id="podium" class="podium"></div>

            <div id="topList" class="top-list">
                <div class="top-loading">
                    Загружаем рейтинг...
                </div>
            </div>

            <div class="top-footer">
                Рейтинг игроков по количеству виртов
            </div>

        </section>

    </section>

    <footer class="footer">
        VIRT © 2026
    </footer>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const API_URL = "https://circumstances-uni-found-locked.trycloudflare.com";

    const telegramUser = tg.initDataUnsafe?.user;

    function formatNumber(value) {
        return Number(value || 0).toLocaleString("ru-RU");
    }

    function defaultAvatar(name) {
        return "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(name || "VIRT") +
            "&background=30333b&color=fff";
    }

    // Аватар Telegram
    if (telegramUser?.photo_url) {
        document.getElementById("avatar").src =
            telegramUser.photo_url;
    } else {
        document.getElementById("avatar").src =
            defaultAvatar("VIRT");
    }

    // Имя Telegram
    if (telegramUser) {
        document.getElementById("name").textContent =
            telegramUser.first_name || "Игрок VIRT";
    }

    function showError(text) {
        document.getElementById("error").textContent = text;
    }

    // Авторизация
    async function login() {
        const code = document.getElementById("code").value.trim();
        const button = document.getElementById("loginButton");

        if (!/^\d{6}$/.test(code)) {
            showError("Введите шестизначный код.");
            return;
        }

        button.disabled = true;
        button.textContent = "Проверка...";
        showError("");

        try {
            const response = await fetch(API_URL + "/auth", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ code })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Ошибка входа");
            }

            localStorage.setItem("virt_session", data.token);

            await loadProfile();

        } catch (error) {
            showError(error.message || "Ошибка соединения.");
        }

        button.disabled = false;
        button.textContent = "Войти в аккаунт";
    }

    // Загрузка профиля
    async function loadProfile() {
        const token = localStorage.getItem("virt_session");

        if (!token) return;

        try {
            const response = await fetch(API_URL + "/me", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            if (!response.ok) {
                localStorage.removeItem("virt_session");

                document.getElementById("account")
                    .classList.add("hidden");

                document.getElementById("login")
                    .classList.remove("hidden");

                showError("Сессия истекла. Используй /web заново.");
                return;
            }

            document.getElementById("userId").textContent =
                data.user_id;

            document.getElementById("balance").textContent =
                formatNumber(data.balance);

            document.getElementById("bankBalance").textContent =
                formatNumber(data.bank_balance);

            document.getElementById("login")
                .classList.add("hidden");

            document.getElementById("account")
                .classList.remove("hidden");

            await loadTop(token);

        } catch (error) {
            showError("Не удалось подключиться к серверу.");
        }
    }

    // Загрузка TOP-100
    async function loadTop(token) {
        const list = document.getElementById("topList");
        const podium = document.getElementById("podium");

        list.innerHTML =
            '<div class="top-loading">Загружаем TOP-100...</div>';

        podium.innerHTML = "";

        try {
            const response = await fetch(API_URL + "/top", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Не удалось загрузить рейтинг");
            }

            const users = data.users || [];

            if (!users.length) {
                list.innerHTML =
                    '<div class="top-empty">Пока игроков нет.</div>';
                return;
            }

            // Первые три места
            const podiumUsers = [
                users[1],
                users[0],
                users[2]
            ].filter(Boolean);

            const classes = ["second", "first", "third"];
            const medals = ["🥈", "👑", "🥉"];

            podium.innerHTML = podiumUsers.map((user, index) => {
                const avatar = user.photo_url ||
                    defaultAvatar(user.name || user.user_id);

                return `
                    <div class="podium-item ${classes[index]}">
                        <div class="podium-crown">${medals[index]}</div>
                        <img
                            class="podium-avatar"
                            src="${escapeHtml(avatar)}"
                            onerror="this.src=defaultAvatar('VIRT')"
                        >
                        <div class="podium-name">
                            ${escapeHtml(user.name || "Игрок " + user.user_id)}
                        </div>
                        <div class="podium-rank">#${user.rank}</div>
                        <div class="podium-balance">
                            ${formatNumber(user.balance)}
                        </div>
                    </div>
                `;
            }).join("");

            // Остальные места
            list.innerHTML = users.slice(3).map(user => {
                const avatar = user.photo_url ||
                    defaultAvatar(user.name || user.user_id);

                const username = user.username
                    ? "@" + user.username
                    : "ID: " + user.user_id;

                return `
                    <div class="top-player">
                        <div class="player-rank">#${user.rank}</div>

                        <img
                            class="player-avatar"
                            src="${escapeHtml(avatar)}"
                            onerror="this.src=defaultAvatar('VIRT')"
                        >

                        <div class="player-info">
                            <div class="player-name">
                                ${escapeHtml(user.name || "Игрок " + user.user_id)}
                            </div>

                            <div class="player-username">
                                ${escapeHtml(username)}
                            </div>
                        </div>

                        <div class="player-balance">
                            ${formatNumber(user.balance)}
                        </div>
                    </div>
                `;
            }).join("");

        } catch (error) {
            list.innerHTML =
                '<div class="top-empty top-error">' +
                escapeHtml(error.message || "Ошибка загрузки TOP-100") +
                '</div>';
        }
    }

    // Защита текста от HTML-вставок
    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    loadProfile();
</script>

</body>
</html>
