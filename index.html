<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu {
            width: 100%;
            max-width: 400px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .profile {
            width: 100%;
            max-width: 400px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ccc;
            margin: 0 auto 15px auto;
            object-fit: cover;
        }
        .name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .username { color: #666; margin-bottom: 10px; }
        .id { font-size: 12px; color: #999; }
        .balance-box {
            width: 100%;
            max-width: 400px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .bank-box {
            width: 100%;
            max-width: 400px;
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu">Главное меню</div>

    <div class="profile">
        <img id="user-photo" class="avatar" src="" alt="Аватарка">
        <div id="user-name" class="name">Загрузка...</div>
        <div id="user-username" class="username"></div>
        <div id="user-id" class="id"></div>
    </div>

    <div id="user-balance" class="balance-box">💰 Баланс: загрузка...</div>
    <div id="user-bank" class="bank-box">🏦 Банк: загрузка...</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        
        let user = tg.initDataUnsafe?.user;
        
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            
            if (user.username) {
                document.getElementById('user-username').innerText = '@' + user.username;
            }
            
            document.getElementById('user-id').innerText = 'ID: ' + user.id;
            
            if (user.photo_url) {
                document.getElementById('user-photo').src = user.photo_url;
            }

            // --- ЗАПРОС БАЛАНСА У БОТА ---
            // ВАЖНО: тут должен быть IP или домен где запущен твой бот
            // например http://192.168.1.5:8080/api/balance?user_id=...
            const BOT_API_URL = "http://192.168.8.16:8080/api/balance?user_id=" + user.id;
            
            fetch(BOT_API_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        // форматируем с пробелами
                        const formatMoney = (num) => num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                        
                        document.getElementById('user-balance').innerText = "💰 Баланс: " + formatMoney(data.balance) + " вирт";
                        document.getElementById('user-bank').innerText = "🏦 Банк: " + formatMoney(data.bank) + " вирт";
                    } else {
                        document.getElementById('user-balance').innerText = "💰 Баланс: 0 вирт";
                        document.getElementById('user-bank').innerText = "🏦 Банк: 0 вирт";
                    }
                })
                .catch(err => {
                    console.error("Ошибка загрузки:", err);
                    document.getElementById('user-balance').innerText = "💰 Баланс: нет связи с ботом";
                    document.getElementById('user-bank').innerText = "🏦 Банк: нет связи с ботом";
                });
        } else {
            document.getElementById('user-name').innerText = "Пользователь не найден";
        }
    </script>
</body>
</html>
